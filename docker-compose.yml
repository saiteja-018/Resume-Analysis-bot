services:
  bot:
    build: .
    container_name: careermatch-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=10000
    ports:
      - "10000:10000"
    volumes:
      - ./downloads:/app/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
